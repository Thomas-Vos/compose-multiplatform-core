import androidx.build.AndroidXComposePlugin
import androidx.build.JetbrainsAndroidXPlugin
import androidx.build.LibraryType

plugins {
    id("AndroidXPlugin")
    id("com.android.library")
    id("AndroidXComposePlugin")
    id("JetbrainsAndroidXPlugin")
}

AndroidXComposePlugin.applyAndConfigureKotlinPlugin(project)
JetbrainsAndroidXPlugin.applyAndConfigure(project)

androidXComposeMultiplatform {
    android()
    desktop()
    darwin()
    js()
    wasm()
}

kotlin {
    sourceSets {
        androidMain {
            dependencies {
                api("androidx.compose.foundation:foundation:1.8.0")
                api("androidx.compose.ui:ui:1.8.2")
                api("androidx.compose.ui:ui-text:1.8.0")
                api("androidx.compose.runtime:runtime:1.8.0")
                api(project(":wear:compose:compose-foundation"))

                implementation("androidx.compose.animation:animation:1.8.0")
                implementation("androidx.compose.material:material-icons-core:1.7.7")
                implementation("androidx.compose.material:material-ripple:1.7.7")
                implementation("androidx.compose.ui:ui-util:1.8.0")
                implementation(project(":wear:compose:compose-material-core"))
                implementation("androidx.profileinstaller:profileinstaller:1.4.0")
                implementation("androidx.lifecycle:lifecycle-common:2.7.0")
            }
        }

        androidInstrumentedTest {
            dependencies {
                // This :foundation dependency can be removed once the material libraries are updated to use
                // 1.7.0 stable.
                implementation(project(":compose:foundation:foundation"))
                implementation(project(":compose:ui:ui-test"))
                implementation(project(":compose:ui:ui-test-junit4"))
                implementation(project(":compose:test-utils"))
                implementation(androidxArtifact(":test:screenshot:screenshot"))
                implementation(libs.testRunner)
                implementation(libs.truth)
            }
        }

        androidTest {
            dependencies {
                implementation(libs.testRules)
                implementation(libs.testRunner)
                implementation(libs.junit)
            }
        }
    }
}

android {
    defaultConfig {
        minSdk = 25
    }
    buildTypes.configureEach {
        consumerProguardFiles("proguard-rules.pro")
    }
    namespace = "androidx.wear.compose.material"
}

androidx {
    name = "Android Wear Compose Material"
    type = LibraryType.PUBLISHED_LIBRARY
    inceptionYear = "2021"
    description = "WearOS Compose Material Library. This library makes it easier for developers " +
            "to write Jetpack Compose applications for Wearable devices that implement Wear " +
            "Material Design UX guidelines and specifications. It builds upon the Jetpack Compose" +
            " libraries."
    metalavaK2UastEnabled = false
}
